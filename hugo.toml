baseURL = 'https://codersblock.org/'
locale = 'en-gb'
title = "Coder's Block"

# No tags/categories on this site, so don't generate empty taxonomy pages.
disableKinds = ['taxonomy', 'term']

[params]
    author = "Joe Best-Rotheray"
    description = "Adventures in netcode, game engines, and game development"
    tagline = "Adventures in netcode"
    logo = "images/logo.png"

    about = "This is a sporadically updated and eclectic collection of rambles. I delve into netcode, game engines, and game development. I work for IOI on the engine network team."

    [params.social]
        github = "spectre1989"
        twitter = "codersblock"
        linkedin = "joebestrotheray"
        email = "joe@codersblock.org"

[markup]
    [markup.highlight]
        noClasses = false
        lineNos = true
        lineNumbersInTable = true
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
