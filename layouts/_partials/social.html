{{ with site.Params.social }}
<nav class="social" aria-label="Elsewhere">
  {{ with .github }}<a href="https://github.com/{{ . }}">GitHub</a>{{ end }}
  {{ with .twitter }}<a href="https://x.com/{{ . }}">Twitter</a>{{ end }}
  {{ with .linkedin }}<a href="https://www.linkedin.com/in/{{ . }}">LinkedIn</a>{{ end }}
  {{ with .email }}<a href="mailto:{{ . }}">Email</a>{{ end }}
  {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
</nav>
{{ end }}
